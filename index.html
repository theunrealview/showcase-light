<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The Unreal View — presentación interactiva de arquitectura.">
  <title>The Unreal View</title>
  <link rel="icon" href="assets/favicon.webp">


  <script type="module" crossorigin src="./assets/index-ylXPpNxL.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-CUhiH0er.css">
</head>
<body>
  <main class="cover" aria-label="The Unreal View">
    <div class="image-viewport" id="viewport" tabindex="0" aria-label="Imagen panorámica"><img id="cover-image" src="assets/pres-01.webp" alt="Vista arquitectónica del proyecto, imagen 1" fetchpriority="high" draggable="false"></div>
    <div class="toolbar"><button class="glass icon-button" id="menu-button" data-label="menu" aria-haspopup="dialog" aria-controls="menu">☰</button><div class="languages glass" aria-label="Language"><button data-language="es" lang="es">ES</button><button data-language="en" lang="en">EN</button></div></div>
    <button class="previous glass icon-button" id="previous" data-label="previous">‹</button>
    <button class="next glass icon-button" id="next" data-label="next">›</button>
    <span class="swipe glass" id="swipe" data-text="swipe"></span>
    <div class="cover-bottom"><div id="dots" class="dots" aria-label="Imágenes"></div><button id="enter" class="enter glass" aria-haspopup="dialog" aria-controls="menu"><span id="enter-icon"></span><span data-text="enter"></span></button></div>
    <p id="image-error" class="image-error" role="status" hidden></p>
  </main>
  <dialog id="menu" class="app-menu" aria-label="Menú">
    <div class="app-menu-shell">
      <header class="app-menu-header"><div class="app-menu-brand"><img src="assets/nav-logo-hori.webp" alt="The Unreal View"></div><button id="close-menu" class="icon-button" data-label="close" autofocus>×</button></header>
      <nav class="app-menu-content" aria-label="Secciones"><div id="grid" class="app-menu-grid"></div></nav>
      <footer class="app-menu-footer"><div class="footer-preferences"><div class="languages"><button data-language="es" lang="es">ES</button><button data-language="en" lang="en">EN</button></div><span class="tuv"><img src="assets/nav-logo.webp" alt="">TUV</span></div><span class="copyright">© <span id="year"></span> The Unreal View App</span></footer>
    </div>
  </dialog>
  <dialog id="invitation" class="invitation" aria-labelledby="invitation-title" aria-describedby="invitation-description">
    <form method="dialog"><button class="dialog-close icon-button" data-label="close">×</button></form>
    <img class="dialog-logo" src="assets/nav-logo.webp" alt="">
    <p id="selected-section" class="eyebrow"></p>
    <h1 id="invitation-title" data-text="title"></h1>
    <p id="invitation-description" data-text="description"></p>
    <p class="new-tab" data-text="newTab"></p>
    <div class="dialog-actions"><form method="dialog"><button class="cancel" data-text="cancel" autofocus></button></form><a id="open-viewer" class="primary" target="_blank" rel="noopener noreferrer"><span data-text="open"></span><span aria-hidden="true">↗</span></a></div>
  </dialog>
  <noscript>Para explorar esta presentación, activá JavaScript. / Enable JavaScript to explore this presentation.</noscript>
</body>
</html>
